[profile.default]
src = "contracts/8"
out = "artifacts"
test = "src/tests/transferMode"
libs = ["node_modules", "lib"]
optimizer = true
optimizer_runs = 1
# via_ir = true
remappings = [
    "@ensdomains/=node_modules/@ensdomains/",
    "@openzeppelin/=node_modules/@openzeppelin/",
    "eth-gas-reporter/=node_modules/eth-gas-reporter/",
    "hardhat/=node_modules/hardhat/",
    "@dex/=contracts/8/",
]

evm_version = "cancun"
fs_permissions = [{access = "read-write", path = "./"}]

[rpc_endpoints]
arb = "https://arb1.arbitrum.io/rpc"
avax = "https://rpc.ankr.com/avalanche"
base = "https://mainnet.base.org"
bsc = "https://bnb-mainnet.g.alchemy.com/public"
conflux = "https://evm.confluxrpc.com"
cro = "https://evm-cronos.crypto.org"
eth = "https://eth-mainnet.g.alchemy.com/v2/aMbWrR8EcmCGpF6rCSNk0P24wTZbbG7R"
ethw = "https://mainnet.ethereumpow.org"
flare = "https://flare-api.flare.network/ext/C/rpc"
ftm = "https://rpc.ankr.com/fantom"
linea = "https://linea-mainnet.infura.io/v3/13a28cf2840044cda0912560a2336725"
mantle = "https://rpc.mantle.xyz"
okc = "http://35.72.176.238:26659"
op = "https://optimism-mainnet.public.blastapi.io"
polygon = "https://polygon-mainnet.g.alchemy.com/v2/aMbWrR8EcmCGpF6rCSNk0P24wTZbbG7R"
polyzkevm = "https://zkevm-rpc.com"
scroll = "https://rpc.scroll.io"

[fmt]
line_length = 120
tab_width = 4
style = "space"
bracket_spacing = false
int_types = "long"
multiline_func_header = "attributes_first"
quote_style = "double"
number_underscore = "preserve"
hex_underscore = "remove"
single_line_statement_blocks = "preserve"
override_spacing = true
wrap_comments = false
docs_style = "preserve"
ignore = []
contract_new_lines = false
sort_imports = true
pow_no_space = true
call_compact_args = true